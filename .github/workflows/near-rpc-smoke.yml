name: Live NEAR receipt lookup smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/near-rpc-smoke.yml'
      - 'web/transaction-evidence.js'
      - 'scripts/check-rpc-cors.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/near-rpc-smoke.yml'
      - 'web/transaction-evidence.js'
      - 'scripts/check-rpc-cors.mjs'

permissions:
  contents: read

jobs:
  receipt-lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser CORS and real archived NEAR transaction
        run: node scripts/check-rpc-cors.mjs
