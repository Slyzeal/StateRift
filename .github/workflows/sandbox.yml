name: NEAR Sandbox integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
permissions:
  contents: read
jobs:
  near-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
