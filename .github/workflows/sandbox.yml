name: NEAR Sandbox integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
  push:
    branches: [main]
    paths:
      - 'sandbox/**'
      - '.github/workflows/sandbox.yml'
permissions:
  contents: read
jobs:
  near-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify actual compiled NEAR contracts
        run: |
          set -euo pipefail
          npm run verify 2>&1 | tee sandbox-run.log
          node scripts/generate-report.mjs sandbox-run.log reports/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: near-sandbox-verification
          path: |
            sandbox/reports/verification.json
            sandbox/sandbox-run.log
          retention-days: 14
