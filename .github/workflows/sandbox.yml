name: NEAR Sandbox (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  near-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run verify
