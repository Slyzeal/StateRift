<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title">
<title id="title">StateRift dimensional ribbon mark</title>
<defs>
<linearGradient id="upper" x1=".05" y1="0" x2=".9" y2="1"><stop stop-color="#f2f1fc"/><stop offset=".42" stop-color="#a9acca"/><stop offset=".95" stop-color="#525c7f"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b5c88"/><stop offset=".5" stop-color="#262b4b"/><stop offset="1" stop-color="#8582af"/></linearGradient>
<linearGradient id="bottom" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#464c70"/><stop offset=".45" stop-color="#8e90b9"/><stop offset=".96" stop-color="#eceafe"/></linearGradient>
<linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#777b9e"/><stop offset=".8" stop-color="#30364f"/></linearGradient>
<filter id="shadow" x="-25%" y="-25%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#090b19" flood-opacity=".25"/></filter>
</defs>
<g filter="url(#shadow)">
<!-- continuous folded S ribbon, upper face -->
<path d="M22 70Q22 63 30 58L111 12Q121 6 130 11L211 58Q219 63 219 72V99Q219 107 210 102L130 55Q121 50 112 55L22 109Z" fill="url(#upper)" stroke="#d2d2e7" stroke-width="1.3"/>
<!-- hidden inside folds -->
<path d="M22 103L22 124Q23 130 32 135L118 183L208 131Q219 125 219 117V103Q219 112 210 117L120 165L34 116Z" fill="url(#dark)" stroke="#676989" stroke-width="1"/>
<path d="M22 109L111 55Q121 50 130 55L210 101Q219 106 219 100L219 124Q219 132 210 136L125 185L30 132Q20 126 22 109Z" fill="url(#dark)" opacity=".9"/>
<!-- lower folded ribbon -->
<path d="M30 153L113 108L210 163Q219 168 219 178V195Q219 203 211 207L131 234Q122 239 113 234L30 190Q21 185 21 178V169Q21 159 30 153Z" fill="url(#bottom)" stroke="#cbc9eb" stroke-width="1.4"/>
<path d="M22 171L113 122L211 171Q219 176 210 181L129 223Q121 227 113 223L30 182Q22 178 22 171Z" fill="url(#right)" opacity=".65"/>
<path d="M22 179L113 226Q122 231 130 226L211 185Q219 181 219 174V195Q219 202 211 206L131 235Q122 239 113 235L30 190Q21 186 22 179Z" fill="url(#bottom)"/>
<!-- dark inner fold crossing lower band -->
<path d="M38 112L120 160L174 134L213 160L122 211L25 162L25 143Z" fill="url(#dark)" opacity=".94"/>
<path d="M23 104L113 54Q122 49 131 54L213 102" fill="none" stroke="#f5f4ff" stroke-opacity=".42" stroke-width="2"/>
</g>
<!-- center NEAR monogram -->
<path d="M94 142V99Q94 91 101 91Q105 91 109 96L151 145V98Q151 91 158 91Q165 91 165 99V155Q165 161 158 161Q155 161 151 157L108 110V151Q108 159 101 159Q94 159 94 151Z" fill="#fbfbff" stroke="#fafaff" stroke-width="1"/>
<path d="M106 146L153 101" fill="none" stroke="#fdfcff" stroke-width="9" stroke-linecap="round"/>
</svg>